<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — RepQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="repquest-theme.css" />
  <script src="repquest-theme.js"></script>
</head>
<body>
  <nav>
    <a class="logo" href="index.html">Rep<strong>Quest</strong></a>
    <div class="nav-right">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="leaderboard.html">Leaderboard</a>
      <a class="nav-link" href="login.html">Log in</a>
      <a class="nav-link active" href="signup.html">Sign up</a>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <span class="section-label">Join the quest</span>
      <h1 class="auth-title">Sign <span class="accent">up</span></h1>
      <p class="auth-sub">Create your profile, earn points, and climb the global leaderboard.</p>

      <form class="auth-form" id="signupForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="RepChampion" autocomplete="username" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" name="confirm" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <label class="checkbox-label">
          <input type="checkbox" name="terms" />
          I agree to the terms of service (coming soon)
        </label>
        <button type="submit" class="btn-submit">Create account</button>
        <p class="coming-soon" id="comingSoon">Authentication is coming soon — UI only for now.</p>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </main>

  <script>
    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('comingSoon').classList.add('show');
    });
  </script>
</body>
</html>
